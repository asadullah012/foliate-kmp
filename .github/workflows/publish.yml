name: Publish to Maven Central

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0-beta01)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: macos-14
    environment: maven-central
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests and the ABI check
        run: ./gradlew check

      - name: Publish to Maven Central
        run: |
          set -euo pipefail
          if [ -z "${ORG_GRADLE_PROJECT_signingInMemoryKey:-}" ]; then
            echo "::error::SIGNING_IN_MEMORY_KEY is empty. Maven Central rejects an unsigned upload."
            exit 1
          fi
          VERSION_ARG=""
          if [ -n "${{ inputs.version }}" ]; then
            VERSION_ARG="-PVERSION_NAME=${{ inputs.version }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG_VERSION="${{ github.event.release.tag_name }}"
            TAG_VERSION="${TAG_VERSION#v}"
            echo "Publishing release from release tag: $TAG_VERSION"
            VERSION_ARG="-PVERSION_NAME=${TAG_VERSION}"
          elif [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            echo "Publishing release from tag ref: $TAG_VERSION"
            VERSION_ARG="-PVERSION_NAME=${TAG_VERSION}"
          fi
          ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache $VERSION_ARG
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
